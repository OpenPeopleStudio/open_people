name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Check API docs
        run: npm run check:api-docs

      - name: Generate OpenAPI
        run: npm run generate:openapi

      - name: Run tests (contracts)
        run: npx vitest run __tests__/contracts/openapi-schema.test.ts
